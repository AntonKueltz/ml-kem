[package]
name = "mlkem"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "mlkem"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.29.0"
rand = "0.10.3"
sha3 = "0.12.0"
shake = "0.1.0"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "kem"
harness = false

[profile.bench]
debug = true
